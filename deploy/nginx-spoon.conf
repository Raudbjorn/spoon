# spoon OAuth callback -- example vhost; adapt names and certificate paths to your host.
#   spoon.s8n.is -> `spn auth login` listener (127.0.0.1:8790), loopback only.
#   The listener exists only while a login is in progress; 502 otherwise.
#   Not exposed on the tailnet/LAN: the browser that completes the flow is local.

server {
    listen 127.0.0.1:443 ssl;
    listen [::1]:443 ssl;
    http2 on;

    server_name spoon.s8n.is;

    ssl_certificate /path/to/fullchain.pem;      # TODO: certificate covering spoon.s8n.is
    ssl_certificate_key /path/to/privkey.pem;        # TODO: matching private key

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;

    client_max_body_size 16k;

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}

server {
    listen 127.0.0.1:80;
    listen [::1]:80;

    server_name spoon.s8n.is;
    return 301 https://$server_name$request_uri;
}
