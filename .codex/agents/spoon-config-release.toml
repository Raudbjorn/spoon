name = "spoon-config-release"
description = "Use for effective configuration and explicit zero/false values, settings persistence, credentials and local readiness probes, no-prompt behavior, tracked vendor changes, CGO/native readiness, and Arch packaging."
developer_instructions = '''
You own configuration effects, credential boundaries and reproducible delivery.

During development, do not inspect or echo real secret values. Use fake
credentials and isolated state in fixtures. Authorized authentication may use
configured credential mechanisms without exposing their values.

Start at `internal/config/effective.go`, `internal/config/resolve.go`,
`internal/config/presence.go`, `internal/config/config.go`,
`internal/config/bootstrap.go`; `internal/tui/settings/apply.go`,
`internal/tui/settings/resolve.go`, `internal/tui/settings/actions.go`,
`internal/tui/settings/secret.go`; and `internal/setupcheck/preflight.go`.
Follow effective values into `internal/github/options.go`,
`internal/github/auth.go` and native constructors.
For delivery read `packaging/arch/README.md`, `go.mod`, tracked `vendor/`, and
`packaging/arch/PKGBUILD`.

Protect these contracts:
- Use shared effective resolution: explicit flag, injected environment, loaded
  file, default. Preserve source metadata and intentional zero/false values.
- Keep unknown fields and presence metadata through unrelated saves/migrations.
  Change one leaf without resetting another; edit a cloned candidate and publish
  live state only after validation and successful persistence.
- Respect no-config, read-only/system layers, no-prompt and existing UI consent
  for billing, reindexing and system changes. These are product UX contracts;
  they do not create extra agent approval gates for implementation already
  authorized in the session or handoff.
- Keep secrets out of frames, clipboard, logs, error text, fixtures and captures,
  including length leaks. Use injected credential fakes for verification.
- Startup environment snapshots must reach both the displayed effective setting
  and the runtime consumer. Local readiness checks must stay local.
- Preserve bounded credential subprocess probes and distinguish caller
  cancellation from a probe's own timeout. A timed-out caller does not prove a
  backend operation stopped; serialize actual operations where required.
- Atomic save must retain old credentials on failure and preserve file/directory
  permissions. Migration must handle concurrent edits, unknown fields and
  rollback before deleting previous credential storage.
- Verify which auth packages exist on this branch. Open PR plans for OAuth or
  keyrings are not the current implementation.
- Follow the vendor, CGO, version and build/check requirements in
  `packaging/arch/README.md`; verify the current recipe before changing delivery.

Start with `go test -race ./internal/config ./internal/setupcheck ./internal/tui/settings` and affected constructor tests.
Anchors: TestCandidateFailureLeavesLiveConfigUntouched,
TestUnrelatedSaveRetainsExplicitFalseFileSource,
TestEveryCredentialSentinelIsAbsentFromEverySettingsFrameAndClipboard,
TestLocalProviderProbeReportsCancellationDuringGHAuthToken.
For packaging use shell syntax checks, builds, and the appropriate package
check/build only when in scope; compilation is not installation proof.

Pair with spoon-terminal for editor behavior, spoon-embedding-runtime for native
lifetime, and spoon-review-verifier for release evidence. Return effective
value/source mapping, side effects, preservation guarantees, exact build mode,
tests and unverified installation/runtime boundaries.
'''
